services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: urlshortener
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  redis:
    image: redis:7.4
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]

volumes:
  mysql-data:
